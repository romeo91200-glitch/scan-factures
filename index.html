<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scan Factures</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran d'accueil : l'appareil photo ne s'ouvre que sur demande -->
  <section id="home" class="screen active">
    <div class="home">
      <p id="homeClient" class="home-client">Factures</p>
      <button id="btnPhoto" class="big" type="button"><span aria-hidden="true">📷</span> Photographier une facture</button>

      <div id="status" class="status">
        <p id="statusTitle" class="status-title">…</p>
        <p id="statusDetail" class="status-detail"></p>
        <button id="btnRetry" class="secondary" type="button" hidden>Réessayer l'envoi</button>
        <ul id="pendingList" class="pending"></ul>
      </div>

      <label class="primary ghost home-import">Choisir une photo déjà prise<input type="file" id="fileInputHome" accept="image/*" hidden></label>
      <button id="btnCodeHome" class="linkish" type="button">Code client</button>
    </div>
  </section>

  <!-- Écran caméra -->
  <main id="camera" class="screen">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <header class="topbar">
      <button id="btnBack" class="pill back" type="button">✕ Terminer</button>
      <button id="queueBadge" class="pill badge" type="button" hidden></button>
    </header>

    <div id="guide" class="guide neutral">
      <div id="guideMain">Démarrage de la caméra…</div>
      <div id="guideMore"></div>
    </div>

    <footer class="bottombar">
      <label class="toggle"><input type="checkbox" id="autoCapture" checked> Auto</label>
      <button id="btnShoot" class="shoot" type="button" aria-label="Prendre la photo"><span></span></button>
      <button id="btnTorch" class="pill" type="button" hidden>Flash</button>
      <label class="toggle" id="cropToggle"><input type="checkbox" id="autoCrop" checked> Recadrer</label>
    </footer>

    <div id="startOverlay" class="start" hidden>
      <p>L'application a besoin de la caméra pour photographier vos factures.</p>
      <button id="btnStart" class="primary" type="button">Activer la caméra</button>
      <p class="small" id="startError"></p>
      <label class="primary ghost">Importer une photo<input type="file" id="fileInput" accept="image/*" hidden></label>
    </div>

  </main>

  <!-- Écran aperçu -->
  <section id="preview" class="screen">
    <img id="previewImg" alt="Aperçu de la facture">
    <div id="previewInfo" class="info"></div>
    <div class="actions">
      <button id="btnRetake" class="secondary" type="button">Refaire</button>
      <button id="btnSend" class="primary" type="button">Envoyer</button>
    </div>
  </section>

  <div id="codeOverlay" class="start" hidden>
    <p><strong>Votre code client</strong></p>
    <p class="small">Il figure à la fin du lien qui vous a été envoyé (ex. DUPONT-7K3QX9).</p>
    <input id="codeInput" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="CODE-CLIENT">
    <button id="btnCode" class="primary" type="button">Valider</button>
    <p class="small" id="codeError"></p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <canvas id="work" hidden></canvas>
  <script src="config.js"></script>
  <script src="analyzer.js"></script>
  <script src="upload.js"></script>
  <script src="app.js"></script>
</body>
</html>
